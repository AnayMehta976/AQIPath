name: aqi_app
description: "Track real-time air quality, get alerts, and stay safe with personalized tips based on your location."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.5+6

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  #map
  google_maps_flutter: ^2.12.2 
  flutter_map: ^8.1.1
  google_places_flutter: ^2.0.8
  googleapis_auth: ^2.0.0
  permission_handler: ^11.3.1
  # app_settings: any
  crypto: ^3.0.1
  geolocator: any
  location: ^8.0.1
  # background_locator_2: ^2.0.6
  geocoding: ^4.0.0
  flutter_polyline_points: ^2.1.0
  vector_math: ^2.1.4
  # Add this line for heatmap functionality
  geodesy: ^0.10.2
  #firebase
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.6
  firebase_auth: ^5.5.4
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^19.5.0
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.0.0
  typewritertext: ^3.0.9
  package_info_plus: ^8.3.1
  syncfusion_flutter_gauges:
  #image
#  image_picker: ^1.1.2
#  image_gallery_saver: ^2.0.3
#  multi_image_picker: ^4.8.0
  #bloc
  flutter_bloc: ^9.1.1
  #provider
  provider: ^6.1.5
  #payment
#  square_in_app_payments: ^1.6.0
  #data
  equatable: ^2.0.0
  meta: ^1.1.6
  intl: 0.19.0
  rxdart: ^0.27.7

# ui
  flutter_spinkit: ^5.0.0
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  gauge_indicator: ^0.4.3
  flutter_speed_dial: ^7.0.0
  flutter_html:
  #Others
  shared_preferences: ^2.0.4
  uuid: ^4.5.1
  fluttertoast: ^8.0.3
  dio: ^5.8.0+1
#  url_launcher: ^6.0.3
  dropdown_search: ^6.0.2
  flutter_svg: ^2.0.9 # Help us to use svg in our app
  flutter_launcher_icons: ^0.14.3
  path_provider: ^2.0.1
  bloc_concurrency: ^0.3.0
  connectivity_plus:
#local db
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
  background_locator_2:
    path: plugins/background_locator_2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    - assets/locale/
  # To add custom fonts to your application, add a fonts section here,
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.otf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.otf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.otf
          weight: 600

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
